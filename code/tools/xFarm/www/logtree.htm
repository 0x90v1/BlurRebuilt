<script language="JavaScript">
var openImg = new Image();

var closedImg = new Image();

var tickImg = new Image();
tickImg.src = "images/tick.gif";
var blankImg = new Image();
blankImg.src = "images/doc.gif";

var boximages = new Array();
var blankimages = new Array();
for (var i=0; i<6; i++)
{
	boximages[i] = new Image();
	blankimages[i] = new Image();
}
boximages[5].src = "images/silver_tick.png";    // debug
boximages[4].src = "images/blue_tick.png";      // info
boximages[3].src = "images/orange_tick.png";    // warn
boximages[2].src = "images/red_tick.png";   	// error
boximages[1].src = "images/black_tick.png";     // fatal

blankimages[5].src = "images/silver.png";    	// debug
blankimages[4].src = "images/blue.png";      	// info
blankimages[3].src = "images/orange.png";       // warn
blankimages[2].src = "images/red.png";    		// error
blankimages[1].src = "images/black.png";     	// fatal


function node(text, id)
{
	this.id = id;
	this.text = text;
	this.write = writeNode;
	this.add = addLeaf;
	this.generateParameterString = generateParameterString;
	this.children = new Array();
	this.debugLevel = 0;
	this.refreshTickBoxDisplay = refreshTickBoxDisplay;
}

function addNode(node){
	this.children[this.children.length] = node;
}

function writeButton(button, debugLevel)
{
	var img;
	if (button.debugLevel > 0)
	    img = boximages[debugLevel];
	else
	    img = blankimages[debugLevel];

	var s = '<img src="' + img.src + '" onclick="return buttonClick(event, \'janMenu\');" id="I' + button.id + '">';
	return s;
}

function writeNode(parentdebuglevel)
{
	var debugLevel = 0;
	if (this.debugLevel > 0)
	    debugLevel = this.debugLevel;
	else
		debugLevel = parentdebuglevel;

	if (this.children.length > 0)
	{
		var nodeString = '<span class="node"><span onClick="showNode(\'' + this.id + '\')"';
		nodeString += '><img src="images/open.gif" id="N' + this.id + '">' + this.text + '</span>';
		nodeString += '<span class="box">';
		nodeString += writeButton(this, debugLevel);
		nodeString += '</span>';
		nodeString += '<span class="leaf" id="';
		nodeString += this.id + '">';
		var numChildren = this.children.length;
		for(var j=0;j<numChildren;j++)
		{
			nodeString += this.children[j].write(debugLevel);
		}

		nodeString += '</span>';

	}
	else
	{
		var nodeString = '<span class="leaf">';
		nodeString += '<img src="images/doc.gif" border="0">';
		nodeString += this.text;
		nodeString += '<span class="box">';
		nodeString += writeButton(this, debugLevel);
		nodeString += '</span></span>';

//		nodeString += '<br>';
	}

	return nodeString;
}

function refreshTickBoxDisplay(parentdebuglevel, button, value)
{
	objImg = document.getElementById("I" + this.id);
	if (objImg == button)
	    this.debugLevel = value;

	var debugLevel = 0;
	if (this.debugLevel > 0)
	    debugLevel = this.debugLevel;
	else
		debugLevel = parentdebuglevel;

	var img;
	if (this.debugLevel > 0)
	    img = boximages[debugLevel];
	else
	    img = blankimages[debugLevel];

	objImg.src = img.src;
	
	var numChildren = this.children.length;
	for(var j=0;j<numChildren;j++)
	{
		this.children[j].refreshTickBoxDisplay(debugLevel, button, value);
	}
}

function addLeaf(leaf){
	this.children[this.children.length] = leaf;
}

function writeLeaf(){
	return leafString;
}

function changeDebugLevelBox(button, value)
{
//	button.src = boximages[value].src;
	root.refreshTickBoxDisplay(3, button, value);
	refreshLogDisplay();
}

function generateParameterString(parentdebuglevel)
{
 	var debugLevel = 0;
	if (this.debugLevel > 0)
	    debugLevel = this.debugLevel;
	else
		debugLevel = parentdebuglevel;

	var parameters = '&' + this.id.replace(/\./g, '_') + '=';
    parameters += debugLevel;

	var numChildren = this.children.length;
	for (var j=0; j<numChildren; j++)
	{
		parameters += this.children[j].generateParameterString(debugLevel);
	}
	
	return parameters;
}

function refreshLogDisplay()
{
	// change log frame contents
	parent.content.location.href='displaylog.php?file=' + getLogFilename() + root.generateParameterString(4) + "#bottom";
}

function clickTickButton(value)
{
	resetButton(activeButton);
	changeDebugLevelBox(activeButton, value);
    activeButton = null;
}

function showNode(node){
	var objNode = document.getElementById(node).style;
	if(objNode.display=="none")
		objNode.display="block";
	else
		objNode.display="none";
	swapFolder('N' + node);
}

function swapFolder(img){
	objImg = document.getElementById(img);
	if(objImg.src.indexOf('images/closed.gif')>-1)
		objImg.src = openImg.src;
	else
		objImg.src = closedImg.src;
}
