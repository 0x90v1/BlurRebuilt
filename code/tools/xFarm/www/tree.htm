<html>
<style>
body{
	font: 10pt Verdana,sans-serif;
	color: navy;
}
.branch{
	cursor: pointer;
	cursor: hand;
	display: block;
}
.leaf{
	display: none;
	margin-left: 16px;
}
a{
	text-decoration: none;
}
a:hover{
	text-decoration: underline;
}
</style>

<script language="JavaScript">
var openImg = new Image();
openImg.src = "open.gif";
var closedImg = new Image();
closedImg.src = "closed.gif";
var tickImg = new Image();
tickImg.src = "tick.gif";
var blankImg = new Image();
blankImg.src = "doc.gif";


function tree(){
	this.branches = new Array();
	this.add = addBranch;
	this.write = writeTree;
}

function branch(id, text){
	this.id = id;
	this.text = text;
	this.write = writeBranch;
	this.add = addLeaf;
	this.leaves = new Array();
}

function leaf(text, link){
	this.id = text;
	this.text = text;
	this.link = link;
	this.tick = 0;
	this.write = writeLeaf;
}

function writeTree(){
	var treeString = '';
	var numBranches = this.branches.length;
	for(var i=0;i<numBranches;i++)
		treeString += this.branches[i].write();
	document.write(treeString);
}

function addBranch(branch){
	this.branches[this.branches.length] = branch;
}

function writeBranch(){
	var branchString = '<span class="branch" onClick="showBranch(\'' + this.id + '\')"';
	branchString += '><img src="closed.gif" id="I' + this.id + '">' + this.text;
	branchString += '</span>';
	branchString += '<span class="leaf" id="';
	branchString += this.id + '">';
	var numLeaves = this.leaves.length;
	for(var j=0;j<numLeaves;j++)
		branchString += this.leaves[j].write();
	branchString += '</span>';
	return branchString;
}

function addLeaf(leaf){
	this.leaves[this.leaves.length] = leaf;
}

function writeLeaf(){
//	var leafString = '<a href="' + this.link + '">';
	var leafString = '<span onClick="tickLeaf(\'' + this.id + '\')">';
	if (this.tick)
		leafString += '<img id="I' + this.id + '" src="tick.gif" border="0">';
	else
		leafString += '<img id="I' + this.id + '" src="doc.gif" border="0">';
	leafString += this.text;
//	leafString += '</a><br>';
	leafString += '</span><br>';
	return leafString;
}

function tickLeaf(leaf)
{
	objImg = document.getElementById('I' + leaf);
	if(objImg.src.indexOf('tick.gif')>-1)
		objImg.src = blankImg.src;
	else
		objImg.src = tickImg.src;
		
	// change log frame contents
	parent.content.location.href='displaylog.php';	
}

function showBranch(branch){
	var objBranch = document.getElementById(branch).style;
	if(objBranch.display=="block")
		objBranch.display="none";
	else
		objBranch.display="block";
	swapFolder('I' + branch);
}

function swapFolder(img){
	objImg = document.getElementById(img);
	if(objImg.src.indexOf('closed.gif')>-1)
		objImg.src = openImg.src;
	else
		objImg.src = closedImg.src;
}
</script>
</head>
<body>
<!-- place the tree building script where you'd like in the body -->
<script language="JavaScript">
var myTree = new tree();
var tools = new branch('branch1','tools');
var lightingtool = new branch('branch2','lightingtool');
var lux = new leaf('lux','#');
var clusterlib = new leaf('clusterlib','#');
var aftk = new leaf('aftk','#');

tools.add(lightingtool);
tools.add(clusterlib);
tools.add(aftk);
lightingtool.add(lux);
myTree.add(tools);

myTree.write();
</script>
</body>
</html>
